<div class="bills-container">
    <div class="bills-header print-hide">
        <h2>Bills</h2>
        <button id="saveAllBtn" class="save-all-btn">Save All</button>
    </div>

    <!-- Search Section -->
    <div class="search-section print-hide">
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" id="billSearch" class="search-input" placeholder="Search bills...">
        </div>
        <div class="search-options">
            <div class="search-option">
                <input type="radio" id="searchByName" name="searchOption" value="name" checked>
                <label for="searchByName">Search by Name</label>
            </div>
            <div class="search-option">
                <input type="radio" id="searchByPhone" name="searchOption" value="phone">
                <label for="searchByPhone">Search by Phone</label>
            </div>
            <div class="search-option">
                <input type="radio" id="searchById" name="searchOption" value="id">
                <label for="searchById">Search by Bill ID</label>
            </div>
        </div>
    </div>

    <!-- Search Results Section (Initially Hidden) -->
    <div id="searchResultsSection" class="dropdown-section print-hide" style="display: none;">
        <div class="dropdown-header" id="searchResultsHeader">
            <div class="dropdown-title">Search Results</div>
            <span class="dropdown-icon">►</span>
        </div>
        <div class="dropdown-content" id="searchResultsContent">
            <div id="searchResultsGrid" class="bills-grid">
                <!-- Search results will be populated here -->
            </div>
        </div>
    </div>

    <!-- Recent Bills Section -->
    <div class="dropdown-section print-hide">
        <div class="dropdown-header" id="recentBillsHeader">
            <div class="dropdown-title">
                Recent Bills
                <!-- <div class="sort-options" onclick="event.stopPropagation()">
                    <span class="sort-text">Sort by:</span>
                    <select id="sortSelect" class="sort-select">
                        <option value="date">Date</option>
                        <option value="id">ID 
                        </option>
                        <option value="total">Total Price</option>
                    </select>
                    <span class="info-icon" id="sortInfoIcon">i
                        <span class="tooltip">Sort bills by date, ID number, or total price</span>
                    </span>
                </div> -->
            </div>
            <span class="dropdown-icon">►</span>
        </div>
        <div class="dropdown-content" id="recentBillsContent"  style="display: none;">
            <div id="recentBillsGrid" class="bills-grid">
                <!-- Recent bills will be populated here -->
            </div>
        </div>
    </div>

    <div class="bill-section unhide-on-print">
        <div id="date-time" class="date-time">Loading...</div>
            <div class="bill-header">
                <h2>Bill <span id="pos-bill-id"></span></h2>
            </div>

            <div class="table-wrap">
  
              <table class="bill-table">
                  <thead>
                      <tr>
                          <th>Item</th>
                          <th>Qty</th>
                          <th>Price(₹)</th>
                          <th>Offer(₹)</th>
                          <th>Total(₹)</th>
                          <th class="print-hide" style="width:40px; pointer-events: pointer;" onclick="clearbill()"><b>X</b></th> <!-- Compact column header -->

                      </tr>
                  </thead>
                  <tbody id="billing">
                      <tr>
                          <td>-</td>
                          <td>-</td>
                          <td>-</td>
                          <td>-</td>
                          <td>-</td>
                          <td>-</td>

                          
                      </tr>
                      
                  </tbody>
              </table>
            </div>
            
            <div id="bill-summary" class="bill-summary">
                <div class="bill-row">
                    <span>Subtotal:</span>
                    <span id='subtotal'>-</span>
                </div>
                <div class="bill-row">
                    <span style="color: #4caf50;"><b>- You Saved </b>:</span>
                    <span id="offer">-</span>
                </div>
                <div class="bill-row">
                    <span style="color: #f44336;">+ Tax:</span>
                    <span id='tax'>-</span>
                </div>
                <div class="bill-row">
                    <span>Total:</span>
                    <span id='total'>-</span>
                </div>
            </div>
            <div id="purchasor-name" style="display:none;">
                <h3>Purchased By,</h3>
                <p id="pos-put-name"></p>
            </div>
    </div>
</div>
